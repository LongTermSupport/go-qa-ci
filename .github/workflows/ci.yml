name: CI

# job go: formatting, vet, the race-enabled tests and golangci-lint over this module.
# job self-gate: go-qa run --ci over go-qa's own source (every tool except mutants), so the toolchain is held to its own
# standard (TOOLING-SPEC 8.2). It runs in CI mode: formatters rewrite, then the job fails when the
# working tree changed. The golangci configuration it analyses with is the bundled baseline plus
# qa/golangci-overlay.yml (tests/selfgate, run by job go, proves .golangci.yml is exactly that);
# 8.2 is met only in part, see docs/CONFORMANCE.md for the recorded gaps.
# job workflows: actionlint over the workflows and shellcheck over the shell scripts.
# Every external tool is installed by scripts/install-tools.sh at the version tools.lock pins.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go (fmt, vet, test, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ast-grep: the bundled rule pack's tests run the real binary.
      - name: Install golangci-lint and ast-grep (versions from tools.lock)
        run: |
          scripts/install-tools.sh golangci-lint ast-grep
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: golangci-lint run ./...

  self-gate:
    name: Self-gate (go-qa run --ci)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The record ratchet compares against the merge base, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned tools (versions from tools.lock)
        run: |
          scripts/install-tools.sh
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: go install ./cmd/go-qa
      - name: go-qa run --ci
        run: go-qa run --ci

  workflows:
    name: Workflow and script lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (version and sha256 from tools.lock)
        run: |
          export GOBIN="${RUNNER_TEMP}/bin"
          PATH="${GOBIN}:${PATH}" scripts/install-tools.sh actionlint
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - run: actionlint
      - run: shellcheck scripts/*.sh .githooks/* .github/scripts/*.sh
