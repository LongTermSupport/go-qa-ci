name: CI

# job go: formatting, vet, the race-enabled tests and golangci-lint over this module.
# job self-gate: go-qa run --ci over go-qa's own source (every tool except mutants), so the toolchain is held to its own
# standard (TOOLING-SPEC 8.2). It runs in CI mode: formatters rewrite, then the job fails when the
# working tree changed. The golangci configuration it analyses with is the bundled baseline plus
# qa/golangci-overlay.yml (tests/selfgate, run by job go, proves .golangci.yml is exactly that);
# 8.2 is met only in part, see docs/CONFORMANCE.md for the recorded gaps.
# job workflows: actionlint over the workflows and shellcheck over the shell scripts.
# Every external tool is installed by scripts/install-tools.sh (go-qa install-tools) at the version
# tools.lock pins, into the go-qa tool directory; --print-path hands that directory to later steps.
# job actions-qa-ci (pull requests only): LongTermSupport/actions-qa-ci over the workflows.
# A push that changes only documentation starts no run; pull requests are never filtered. The
# Markdown the build or tests read stays in: ruledocs/ and internal/ (embedded in the binary), and
# docs/CONFORMANCE.md, analyzers.md and defences.md (read by tests/). README.md, which tests/ also
# reads, is left out: a README-only change is tested on its pull request.
on:
  push:
    branches: ["**"]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/CONFORMANCE.md"
      - "docs/analyzers.md"
      - "docs/defences.md"
      - "ruledocs/**"
      - "internal/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".claude/**"
      - ".github/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every go command runs with the Go setup-go installed, never a fetched one. setup-go itself runs
# with GOTOOLCHAIN=auto, because under local it installs the go directive's release (the consumer
# floor) instead of go.mod's toolchain line (the patched release CI judges with).
env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go (fmt, vet, test, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
        env:
          GOTOOLCHAIN: auto
      # ast-grep and gremlins: their tests run the real binary, and a test that cannot run fails.
      - name: Install golangci-lint, ast-grep and gremlins (versions from tools.lock)
        run: scripts/install-tools.sh --print-path golangci-lint ast-grep gremlins >> "${GITHUB_PATH}"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: golangci-lint run ./...

  self-gate:
    name: Self-gate (go-qa run --ci)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The record ratchet compares against the merge base, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
        env:
          GOTOOLCHAIN: auto
      - name: Install the pinned tools (versions from tools.lock)
        run: scripts/install-tools.sh --print-path >> "${GITHUB_PATH}"
      - run: go install ./cmd/go-qa
      - name: go-qa run --ci
        run: go-qa run --ci

  workflows:
    name: Workflow and script lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
        env:
          GOTOOLCHAIN: auto
      - name: Install actionlint (version and sha256 from tools.lock)
        run: scripts/install-tools.sh --print-path actionlint >> "${GITHUB_PATH}"
      - run: actionlint
      - run: shellcheck scripts/*.sh .githooks/* .github/scripts/*.sh

  actions-qa-ci:
    name: actions-qa-ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: LongTermSupport/actions-qa-ci@2784a484769348f14ed780db9b45cd3a402bf31e # v0.1.0
