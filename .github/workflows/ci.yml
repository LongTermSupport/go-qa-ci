name: CI

# job go: formatting, vet, the race-enabled tests and golangci-lint over this module.
# job self-gate: go-qa run --ci over go-qa's own source (every tool except summary and mutants), so the toolchain is held to its own
# standard (TOOLING-SPEC 8.2). It runs in CI mode: formatters rewrite, then the job fails when the
# working tree changed. The golangci configuration it analyses with is the bundled baseline plus
# qa/golangci-overlay.yml (tests/selfgate, run by job go, proves .golangci.yml is exactly that);
# 8.2 is met only in part, see "Self-gate" in docs/golangci.md for the recorded gaps.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: "2.14.0"

jobs:
  go:
    name: Go (fmt, vet, test, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint (checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/install-golangci-lint.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: golangci-lint run ./...

  self-gate:
    name: Self-gate (go-qa run --ci)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The record ratchet compares against the merge base, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint (checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/install-golangci-lint.sh
      - name: Install deadcode and govulncheck (pinned, verified by the Go checksum database)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: go build -o "${RUNNER_TEMP}/bin/go-qa" ./cmd/go-qa
      - name: go-qa run --ci
        run: |
          "${RUNNER_TEMP}/bin/go-qa" run --ci
