# The self-gate (go-qa run --ci) runs every tool; a tool is switched off below only with the
# reason stated beside it.
[record]
# Placeholder identity: replace it with the repository owner before the first public release.
deciders = ["example-owner"]

[record.trust.models]
# Entries written by this model family are medium trust: 30-day review, at most three entries.
claude-sonnet = "medium"

[summary]
file = "AGENTS.md"

[tools]
# Mutation testing is off until gremlins is part of the pinned toolchain install.
mutants = false
