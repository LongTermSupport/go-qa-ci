# The self-gate (go-qa run --ci) runs every tool; a tool is switched off below only with the
# reason stated beside it.
[record]
# A role, not a person: whoever owns this repository signs as "repository-owner". It is the name
# decided_by must carry for the ratchet and for any entry marked human (docs/record.md,
# "Deciders"); a project replaces it with the names of its own deciders.
deciders = ["repository-owner"]

[record.trust.models]
# Entries written by this model family are medium trust: 30-day review, at most three entries.
claude-sonnet = "medium"

[summary]
file = "AGENTS.md"

[tools]
# Mutation testing is off: gremlins is pinned in tools.lock, but no mutation run of this
# repository has been held to a threshold yet (docs/CONFORMANCE.md, 8.2).
mutants = false
