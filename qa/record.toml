# The project record: every configuration exception go-qa's own source relies on, decided here
# because the suppression detector fails any exception that is not recorded (docs/record.md,
# "Configuration exceptions"). Each entry names the hazard accepted and the scope it is accepted in.

[ratchet]
high_water = 1
decided_by = "repository-owner"
decided_on = 2026-10-14
reason = "adopting the ceiling at the three configuration exceptions the toolchain's own gate needs"

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G204"
path = ".golangci.yml"
justification = "gosec G204 guards against command injection through a shell or an attacker-chosen program; every launch here is an argument vector with a constant or resolved tool path and no shell. Scope: the seven non-test files that launch the tools (named in .golangci.yml) and the test files, which run git, go and the built test binary the same way; every other file is held to the rule."
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-14
review_by = 2026-11-13
