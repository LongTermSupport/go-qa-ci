# The project record: every configuration exception go-qa's own source relies on, decided here
# because the suppression detector fails any exception that is not recorded (docs/record.md,
# "Configuration exceptions"). Each entry names the hazard accepted and the scope it is accepted in.

[ratchet]
high_water = 1
decided_by = "repository-owner"
decided_on = 2026-10-14
reason = "adopting the ceiling at the three configuration exceptions the toolchain's own gate needs"

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G204"
path = ".golangci.yml"
justification = "gosec G204 guards against command injection through a shell or an attacker-chosen program. Scope: the one exclusion in .golangci.yml, for internal/launch/launch.go alone, the package every process launch in code and tests goes through; every other file is held to the rule. The hazard cannot arise there: launch takes an argument vector and never a shell, refuses a shell handed a command string (sh -c and the like), runs only a bare name resolved on PATH with exec.LookPath or an absolute path the caller resolved, and binds the process to a context. Permanent because starting processes is that file's purpose, so the rule will always flag it."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-11-17
permanent = true
