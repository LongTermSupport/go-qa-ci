# The project record: every configuration exception go-qa's own source relies on, decided here
# because the suppression detector fails any exception that is not recorded (docs/record.md,
# "Configuration exceptions"). Each entry names the hazard accepted and the scope it is accepted in.

[ratchet]
high_water = 3
decided_by = "example-owner"
decided_on = 2026-10-14
reason = "adopting the ceiling at the three configuration exceptions the toolchain's own gate needs"

[[exception]]
rule = "golangci.yml::govet.disable::fieldalignment"
path = ".golangci.yml"
justification = "Struct field order is not a defect class this toolchain defends against; the hazard is padding bytes in memory-heavy structs, and the module holds no such struct. Scope: the fieldalignment analyzer, module-wide."
decided_by = "example-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-14
review_by = 2026-11-13

[[exception]]
rule = "golangci.yml::gosec.excludes::G204"
path = ".golangci.yml"
justification = "gosec G204 guards against command injection through a shell or an attacker-chosen program; every launch here is an argument vector with a constant or resolved tool path and no shell. Scope: the whole module."
decided_by = "example-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-14
review_by = 2026-11-13

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G306"
path = ".golangci.yml"
justification = "gosec G306 guards against a file written readable by other users; one test installs an executable stub (owner only) in a private temporary directory, which must be executable. Scope: tests/scripts/secret_scan_test.go only."
decided_by = "example-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-14
review_by = 2026-11-13
