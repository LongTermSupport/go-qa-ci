# This repository's golangci-lint overlay: the ONLY difference between the bundled baseline
# (configs/golangci.yml) and the root .golangci.yml that the self-gate analyses go-qa with
# (TOOLING-SPEC 8.2). tests/selfgate proves .golangci.yml is exactly baseline + this overlay, that
# nothing the baseline enables is dropped, and that this file holds only the dependency allow-list
# and the documented switch-offs (docs/golangci.md). Edit here and mirror into
# .golangci.yml; the test fails until both agree.
linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # The dependency set is deliberately small; a new module needs a stated reason.
        main:
          allow:
            - $gostd
            # depguard's $gostd omits the go/* packages the suppression scanner and the bundled
            # type-aware analyzers parse and type-check with.
            - go/ast
            - go/constant
            - go/types
            - go/parser
            - go/token
            - github.com/LongTermSupport/go-qa-ci
            - github.com/pelletier/go-toml/v2
            - go.yaml.in/yaml/v3
            - gopkg.in/yaml.v3
            - golang.org/x/tools
    gosec:
      excludes:
        - G204 # go-qa is a tool runner that starts programs from an argument vector by design; gqaci_shell_exec already forbids a shell with -c
