# The configuration the self-gate runs on go-qa's own source (TOOLING-SPEC 8.2): the bundled
# baseline configs/golangci.yml plus qa/golangci-overlay.yml, nothing else. golangci-lint cannot
# merge files, so this file is the merged result and tests/selfgate fails when it is not exactly
# that, or when any baseline linter, setting, formatter or cap is missing. Change the baseline or
# the overlay, then mirror the change here.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
    # Overlay (qa/golangci-overlay.yml): everything above is the bundled baseline.
    - depguard
  settings:
    depguard:
      rules:
        # The dependency set is deliberately small; a new module needs a stated reason.
        main:
          allow:
            - $gostd
            # depguard's $gostd omits the go/* packages the suppression scanner and the bundled
            # type-aware analyzers parse and type-check with.
            - go/ast
            - go/constant
            - go/types
            - go/parser
            - go/token
            - github.com/LongTermSupport/go-qa-ci
            - github.com/pelletier/go-toml/v2
            - go.yaml.in/yaml/v3
            - gopkg.in/yaml.v3
            - golang.org/x/tools
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    rules:
      # CONFIGURATION EXCEPTION (docs/record.md, "Configuration exceptions"; permanent in
      # qa/record.toml): G204 flags subprocess launches with a variable program or arguments.
      # Hazard: command injection through a shell or an attacker-chosen program. Every launch,
      # in code and in tests, goes through the one file below, which takes an argument vector
      # only, refuses a shell handed a command string, runs a bare name found on PATH or an
      # absolute path and nothing else, and binds the process to a context. Scope: that file
      # alone; every other file is held to the rule.
      - path: ^internal/launch/launch\.go$
        linters:
          - gosec
        text: "G204"

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
