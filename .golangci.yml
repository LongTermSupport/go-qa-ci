# The configuration the self-gate runs on go-qa's own source (TOOLING-SPEC 8.2): the bundled
# baseline configs/golangci.yml plus qa/golangci-overlay.yml, nothing else. golangci-lint cannot
# merge files, so this file is the merged result and tests/selfgate fails when it is not exactly
# that, or when any baseline linter, setting, formatter or cap is missing. Change the baseline or
# the overlay, then mirror the change here.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
    # Overlay (qa/golangci-overlay.yml): everything above is the bundled baseline.
    - depguard
  settings:
    depguard:
      rules:
        # The dependency set is deliberately small; a new module needs a stated reason.
        main:
          allow:
            - $gostd
            # depguard's $gostd omits the go/* packages the suppression scanner and the bundled
            # type-aware analyzers parse and type-check with.
            - go/ast
            - go/constant
            - go/types
            - go/parser
            - go/token
            - github.com/LongTermSupport/go-qa-ci
            - github.com/pelletier/go-toml/v2
            - go.yaml.in/yaml/v3
            - gopkg.in/yaml.v3
            - golang.org/x/tools
    gosec:
      excludes:
        - G204 # go-qa is a tool runner that starts programs from an argument vector by design; gqaci_shell_exec already forbids a shell with -c
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
