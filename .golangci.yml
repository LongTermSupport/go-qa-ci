# The configuration the self-gate runs on go-qa's own source (TOOLING-SPEC 8.2): the bundled
# baseline configs/golangci.yml plus qa/golangci-overlay.yml, nothing else. golangci-lint cannot
# merge files, so this file is the merged result and tests/selfgate fails when it is not exactly
# that, or when any baseline linter, setting, formatter or cap is missing. Change the baseline or
# the overlay, then mirror the change here.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
    # Overlay (qa/golangci-overlay.yml): everything above is the bundled baseline.
    - depguard
  settings:
    depguard:
      rules:
        # The dependency set is deliberately small; a new module needs a stated reason.
        main:
          allow:
            - $gostd
            # depguard's $gostd omits the go/* packages the suppression scanner and the bundled
            # type-aware analyzers parse and type-check with.
            - go/ast
            - go/constant
            - go/types
            - go/parser
            - go/token
            - github.com/LongTermSupport/go-qa-ci
            - github.com/pelletier/go-toml/v2
            - go.yaml.in/yaml/v3
            - gopkg.in/yaml.v3
            - golang.org/x/tools
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        # Struct layout is not a defect class this toolchain defends against.
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    rules:
      # CONFIGURATION EXCEPTION (docs/record.md, "Configuration exceptions"): G204 flags
      # subprocess launches with a variable program or arguments. Hazard: command injection
      # through a shell or an attacker-chosen program name. It does not apply because this
      # toolchain's whole purpose is to run fixed external tools: every launch is an argument
      # vector (never a shell), the program name is a constant or a resolved tool path, and no
      # argument is ever interpreted as shell text. Scope: the seven files that launch the
      # tools (below) and the test files that run git, go and the built test binary; every
      # other file is held to the rule.
      - path: ^(internal/astgrep/run|internal/changed/git|internal/golangci/run|internal/record/gate|internal/runners/command|internal/stage/files|internal/vet/vet)\.go$
        linters:
          - gosec
        text: "G204"
      - path: _test\.go$
        linters:
          - gosec
        text: "G204"
      # CONFIGURATION EXCEPTION (docs/record.md, "Configuration exceptions"): G306 flags a
      # file written with permissions above 0600. Hazard: other users reading or altering it.
      # It does not apply because the scripts tests install executable stubs (0700, owner only)
      # in a private t.TempDir() through the one writeStub helper in this file; a stub that
      # cannot be executed would test nothing. Scope: tests/scripts/secret_scan_test.go only.
      - path: tests/scripts/secret_scan_test\.go
        linters:
          - gosec
        text: "G306"

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
