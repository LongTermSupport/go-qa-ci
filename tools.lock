# Pinned versions of every external tool go-qa and this repository's CI use, installed by
# `go-qa install-tools` and by `go-qa run` (TOOLING-SPEC 9.2 gap closed: the versions were not
# recorded anywhere). The file is embedded in the go-qa binary: it is the only copy of the pins.
# One `name = "value"` per line under a section:
#   [go]        built from source with `go install <package>@<version>`; the Go checksum database
#               verifies the module.
#   [release]   the publisher's linux/amd64 release archive; the value is the version.
#   [checksums] sha256 of the archive of every [release] tool. The install is verified against this
#               pin and nothing the release itself publishes: a replaced asset could ship a replaced
#               checksum file. A [release] tool with no entry here is refused.
# The Go toolchain itself is pinned by go.mod.

[go]
deadcode = "golang.org/x/tools/cmd/deadcode@v0.52.0"
govulncheck = "golang.org/x/vuln/cmd/govulncheck@v1.9.0"
gremlins = "github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0"

[release]
golangci-lint = "2.14.0"
ast-grep = "0.50.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"

[checksums]
golangci-lint = "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab"
